name: Leaf
options:
  createIntermediateGroups: true
  xcodeVersion: "15.4"
  objectVersion: 56
settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: 13.0
    DEVELOPMENT_TEAM: ""
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.0.0
targets:
  Leaf:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - App
      - Models
      - Parsing
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslo.leaf
        PRODUCT_NAME: Leaf
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: GRDB
        product: GRDB
    postBuildScripts:
      - name: Bundle native Kindle MTP helper
        script: '"$SRCROOT/scripts/build_mtp_helper.sh"'
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - LeafTests
  LeafTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/LeafTests
      - Tests/MTP/MTPImportDatabaseTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslo.LeafTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Leaf
